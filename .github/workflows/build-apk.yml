name: Build Android APK

# Builds the APK automatically on every push to main, and lets you trigger
# it manually from the Actions tab too.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Buildozer / python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake build-essential \
            ccache
          python3 --version
          which python3

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

      # This step explicitly performs the Android build. Running main.py by
      # itself does NOT produce an APK -- buildozer drives python-for-android,
      # which downloads the Android SDK/NDK, compiles a Python interpreter
      # for the target ABI, bundles the app + dependencies, and packages an
      # actual .apk. This is the step that does that work.
      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Locate built APK
        id: locate_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-group-tracker-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
